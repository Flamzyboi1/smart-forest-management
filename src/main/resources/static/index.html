<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoIGM Smart Forest</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--green:#1b6b32;--ink:#183b25;--muted:#587060;--line:#d4e4d6}*{box-sizing:border-box}body{font:15px Arial;margin:0;background:#f3f8f2;color:var(--ink)}header{background:#fff;padding:16px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;flex-wrap:wrap}header strong{font-size:20px;color:var(--green)}nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:var(--ink);text-decoration:none}nav a:hover{color:var(--green)}.senslog{font-size:13px;background:#e3f1e4;color:var(--green);padding:7px 10px;border-radius:6px;font-weight:bold}main{max-width:1400px;margin:auto;padding:18px 4%}.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:15px}.toolbar button{background:var(--green);color:white;border:0;border-radius:5px;padding:8px 12px;margin-right:8px;cursor:pointer}.toolbar label{margin-left:10px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.map-card,.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.map-card{padding:0;overflow:hidden}#map{height:650px;min-height:420px}.panel h2{margin-top:0;color:var(--green)}.panel a{display:block;color:var(--green);margin:10px 0}.field{padding:10px 0;border-bottom:1px solid #edf3ed}.muted{color:var(--muted)}.grid-label{background:#fff;border:1px solid #6d9b77;border-radius:3px;color:#37633f;font-size:10px;padding:2px 4px;box-shadow:none}</style></head><body><header><strong>⌁ EcoIGM</strong><nav><a href="/dominant-trees.html">Dominant trees</a><a href="/water-balance.html">Water calculation</a><a href="/irrigation.html">Irrigation</a><a href="/trees.html">Tree recommendations</a><a class="senslog" href="/senslog.html">SensLog</a></nav></header><main><div class="toolbar"><button id="streetBtn" type="button">Street view</button><button id="satBtn" type="button">Satellite view</button><label><input id="gridToggle" type="checkbox" checked> Show grid</label><label><input id="blocksToggle" type="checkbox" checked> Show field blocks</label><span class="muted"> Agronode field coordinates are shown near the map center.</span></div><div class="layout"><section class="map-card"><div id="map"></div></section><aside class="panel"><h2>Forest field</h2><div id="details" class="muted">Select a field or Agronode point on the map.</div><div class="field"><a href="/dominant-trees.html">Open dominant tree analysis →</a><a href="/water-balance.html">Open water calculation →</a><a href="/irrigation.html">Open irrigation analysis →</a><a href="/senslog.html">Open Vestiena SensLog →</a></div></aside></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const agronodeA=[56.840908,25.808939],agronodeB=[56.840809,25.809378],center=[(agronodeA[0]+agronodeB[0])/2,(agronodeA[1]+agronodeB[1])/2];const map=L.map('map').setView(center,17);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'});document.getElementById('streetBtn').onclick=()=>{if(!map.hasLayer(street))map.addLayer(street);if(map.hasLayer(satellite))map.removeLayer(satellite)};document.getElementById('satBtn').onclick=()=>{if(!map.hasLayer(satellite))map.addLayer(satellite);if(map.hasLayer(street))map.removeLayer(street)};function showSensor(name,lat,lng,extra=''){document.getElementById('details').innerHTML='<strong>'+name+'</strong><p>Latitude: '+lat.toFixed(6)+'<br>Longitude: '+lng.toFixed(6)+'</p>'+extra+'<a href="/senslog.html">View SensLog data →</a>'}const agronodeMarkers=L.layerGroup();[['Agronode A',...agronodeA],['Agronode B',...agronodeB]].forEach(([name,lat,lng])=>{const marker=L.marker([lat,lng]).bindPopup('<strong>'+name+'</strong><br>'+lat.toFixed(6)+', '+lng.toFixed(6)+'<br><a href="https://maps.google.com/?q='+lat+','+lng+'" target="_blank" rel="noopener">Open in Google Maps</a>');marker.on('click',()=>showSensor(name,lat,lng,'<p>Actual Agronode location.</p>'));agronodeMarkers.addLayer(marker)}).addTo(map);const fieldBlock=L.polygon([agronodeA,[56.840760,25.809480],agronodeB,[56.840870,25.808850]],{color:'#1b6b32',weight:3,fillColor:'#7dbb83',fillOpacity:.24}).bindPopup('<strong>Agronode field block</strong><br>Defined from the supplied Agronode coordinates.');const blockLayer=L.layerGroup([fieldBlock]).addTo(map);const gridLayer=L.layerGroup();const latMin=56.84065,latMax=56.84105,lngMin=25.80870,lngMax=25.80965;for(let lat=latMin;lat<=latMax+.000001;lat+=.00005){L.polyline([[lat,lngMin],[lat,lngMax]],{color:'#4f8b5b',weight:1,opacity:.48,dashArray:'3 4'}).addTo(gridLayer);L.marker([lat,lngMin],{icon:L.divIcon({className:'grid-label',html:lat.toFixed(5),iconSize:null}),interactive:false}).addTo(gridLayer)}for(let lng=lngMin;lng<=lngMax+.000001;lng+=.00010){L.polyline([[latMin,lng],[latMax,lng]],{color:'#4f8b5b',weight:1,opacity:.48,dashArray:'3 4'}).addTo(gridLayer);L.marker([latMin,lng],{icon:L.divIcon({className:'grid-label',html:lng.toFixed(5),iconSize:null}),interactive:false}).addTo(gridLayer)}gridLayer.addTo(map);document.getElementById('gridToggle').onchange=e=>e.target.checked?gridLayer.addTo(map):map.removeLayer(gridLayer);document.getElementById('blocksToggle').onchange=e=>e.target.checked?blockLayer.addTo(map):map.removeLayer(blockLayer);map.fitBounds([[latMin,lngMin],[latMax,lngMax]],{padding:[30,30]});</script></body></html>
