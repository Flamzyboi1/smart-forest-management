<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoIGM Smart Forest</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--green:#1b6b32;--ink:#183b25;--muted:#587060;--line:#d4e4d6}*{box-sizing:border-box}body{font:15px Arial;margin:0;background:#f3f8f2;color:var(--ink)}header{background:#fff;padding:16px 5%;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;flex-wrap:wrap}header strong{font-size:20px;color:var(--green)}nav{display:flex;gap:14px;flex-wrap:wrap}nav a{color:var(--ink);text-decoration:none}nav a:hover{color:var(--green)}.senslog{font-size:13px;background:#e3f1e4;color:var(--green);padding:7px 10px;border-radius:6px;font-weight:bold}main{max-width:1400px;margin:auto;padding:18px 4%}.toolbar{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:15px}.toolbar button{background:var(--green);color:white;border:0;border-radius:5px;padding:8px 12px;margin-right:8px;cursor:pointer}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.map-card,.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.map-card{padding:0;overflow:hidden}#map{height:650px;min-height:420px}.panel h2{margin-top:0;color:var(--green)}.panel a{display:block;color:var(--green);margin:10px 0}.field{padding:10px 0;border-bottom:1px solid #edf3ed}.muted{color:var(--muted)}.block-label{background:#fff;color:#174e29;border:2px solid #1b6b32;border-radius:5px;padding:4px 7px;font-weight:bold;box-shadow:0 2px 6px #0006}</style></head><body><header><strong>⌁ EcoIGM</strong><nav><a href="/dominant-trees.html">Dominant trees</a><a href="/water-balance.html">Water calculation</a><a href="/irrigation.html">Irrigation</a><a href="/trees.html">Tree recommendations</a><a class="senslog" href="/senslog.html">SensLog</a></nav></header><main><div class="toolbar"><button id="streetBtn" type="button">Street view</button><button id="satBtn" type="button">Satellite view</button><span class="muted">Agronode field-block area shown in yellow.</span></div><div class="layout"><section class="map-card"><div id="map"></div></section><aside class="panel"><h2>Forest field</h2><div id="details" class="muted">Select the Agronode field block on the map.</div><div class="field"><a href="/dominant-trees.html">Open dominant tree analysis →</a><a href="/water-balance.html">Open water calculation →</a><a href="/irrigation.html">Open irrigation analysis →</a><a href="/senslog.html">Open Vestiena SensLog →</a></div></aside></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const A=[56.840908,25.808939],B=[56.840809,25.809378],extent=[[56.84040,25.80820],[56.84125,25.81005]];const map=L.map('map').setView([56.8408585,25.8091585],18);const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri'});document.getElementById('streetBtn').onclick=()=>{if(!map.hasLayer(street))map.addLayer(street);if(map.hasLayer(satellite))map.removeLayer(satellite)};document.getElementById('satBtn').onclick=()=>{if(!map.hasLayer(satellite))map.addLayer(satellite);if(map.hasLayer(street))map.removeLayer(street)};const block=L.polygon([A,[56.84070,25.80965],B,[56.84098,25.80870]],{color:'#176b35',weight:5,opacity:1,fillColor:'#f4c542',fillOpacity:.42}).bindTooltip('Agronode field block',{permanent:true,direction:'center',className:'block-label'}).bindPopup('<strong>Agronode field block</strong><br>Area around the supplied Agronode coordinates.');block.addTo(map);block.bringToFront();block.on('click',()=>{document.getElementById('details').innerHTML='<strong>Agronode field block</strong><p>Field area centered around the supplied Agronode coordinates.</p><p>56.840908, 25.808939<br>56.840809, 25.809378</p><a href="/senslog.html">View SensLog data →</a>'});map.fitBounds(extent,{padding:[45,45],maxZoom:18});setTimeout(()=>{block.bringToFront();map.invalidateSize()},300);</script></body></html>
