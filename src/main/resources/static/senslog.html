<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoIGM SensLog</title><style>:root{--green:#1b6b32;--ink:#183b25;--muted:#587060;--bg:#f3f8f2;--line:#d4e4d6}*{box-sizing:border-box}body{font:15px Arial;margin:0;background:var(--bg);color:var(--ink)}header{padding:20px 6%;background:#fff;border-bottom:1px solid var(--line);color:var(--ink)}header a{color:var(--green);text-decoration:none;font-weight:bold}nav{float:right}nav a{margin-left:18px}main{max-width:1200px;margin:auto;padding:28px 5%}.card{background:#fff;color:var(--ink);padding:20px;border:1px solid var(--line);border-radius:12px;margin-bottom:20px;box-shadow:0 3px 12px #123b2309}h1,h2{color:var(--ink);margin-top:0}p{color:var(--muted)}button{background:var(--green);color:#fff;border:0;padding:10px 14px;border-radius:6px;font-weight:bold;cursor:pointer;margin:0 8px 8px 0}pre{white-space:pre-wrap;max-height:480px;overflow:auto;background:#f5f7f5;color:#183b25;border:1px solid var(--line);padding:15px;border-radius:8px;min-height:80px}.error{color:#9b1c1c}</style></head><body><header><a href="/">⌁ EcoIGM</a><span> · SensLog Vestiena · Smart Forest Management</span><nav><a href="/">Dashboard</a></nav></header><main><div class="card"><h1>Vestiena sensor data</h1><p>User ID: 29 · Group: vestiena</p><button type="button" onclick="loadData('/latest')">Load latest observations</button><button type="button" onclick="loadData('/units')">Load physical units</button></div><div class="card"><h2>Response</h2><pre id="out">Click a button to load data.</pre></div></main><script>async function loadData(path){const out=document.getElementById('out');out.className='';out.textContent='Loading…';try{const r=await fetch('/api/senslog'+path);const text=await r.text();if(!r.ok)out.className='error';out.textContent=(r.ok?'':'HTTP '+r.status+' — ')+text}catch(e){out.className='error';out.textContent='Request failed: '+e.message}}</script></body></html>
