<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Soil Water Balance</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        h1 { color: #2e7d32; }
        table { border-collapse: collapse; width: 100%; margin-top: 1rem; }
        th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; }
        th { background: #e8f5e9; }
        nav a { margin-right: 1rem; text-decoration: none; color: #1b5e20; }
    </style>
</head>
<body>
<h1>Soil Water Balance</h1>
<nav>
    <a href="index.html">Dashboard</a>
    <a href="trees.html">Tree Species</a>
    <a href="dominant-trees.html">Dominant Trees</a>
    <a href="practices.html">Management Practices</a>
    <a href="irrigation.html">Irrigation & Cost Savings</a>
</nav>

<table id="balanceTable">
    <thead>
    <tr>
        <th>Date</th>
        <th>Precipitation (mm)</th>
        <th>Evapotranspiration (mm)</th>
        <th>Irrigation (mm)</th>
        <th>Soil Moisture (%)</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
async function loadBalance() {
    const res = await fetch('/api/water-balance');
    const data = await res.json();
    const tbody = document.querySelector('#balanceTable tbody');
    tbody.innerHTML = '';
    data.forEach(b => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${b.date}</td><td>${b.precipitationMm}</td><td>${b.evapotranspirationMm}</td><td>${b.irrigationMm}</td><td>${b.soilMoisturePercent}</td>`;
        tbody.appendChild(tr);
    });
}
loadBalance();
</script>
</body>
</html>
